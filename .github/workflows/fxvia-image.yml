name: Build FXVIA image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'front-fxvia/**'
      - 'backend/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.github/workflows/fxvia-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sub2api-fxvia:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sub2api-fxvia:candidate
          build-args: |
            VERSION=${{ github.sha }}-fxvia
            COMMIT=${{ github.sha }}
